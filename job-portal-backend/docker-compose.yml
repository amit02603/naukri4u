version: '3.8'

services:
  # ─── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-portal-backend
    ports:
      - '5000:5000'
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - job-portal-network

  # ─── MongoDB (Development Only) ──────────────────────────────
  # In production, use MongoDB Atlas instead.
  mongodb:
    image: mongo:7
    container_name: job-portal-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - job-portal-network

volumes:
  mongodb_data:
    driver: local

networks:
  job-portal-network:
    driver: bridge
